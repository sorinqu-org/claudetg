services:
  claudetg:
    build:
      context: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      CONFIG_PATH: /app/config/config.json
      DATA_DIR: /app/data
      HOME: /app/data/home
      HEALTH_PORT: 3000
    volumes:
      - ./config/config.json:/app/config/config.json:ro
      - ./data:/app/data
      - /srv/projects:/workspace:rw
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
