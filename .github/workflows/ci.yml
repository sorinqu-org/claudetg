name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose manifest
        env:
          CLAUDETG_INTERNAL_TOKEN: ci-internal-token
          CLAUDETG_PROJECT_PATH: /tmp/claudetg-ci-project
        run: |
          cp .env.example .env
          docker compose config --quiet

  docker-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: controller
          push: false
          tags: claudetg-controller:ci

  docker-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          load: true
          push: false
          tags: claudetg-worker:ci
      - name: Smoke-test worker runtime
        run: |
          docker volume create claudetg-ci-home >/dev/null
          docker run -d --name claudetg-worker-ci \
            --read-only \
            --tmpfs /tmp:rw,size=256m,mode=1777 \
            --tmpfs /run:rw,size=32m,mode=0755 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -v claudetg-ci-home:/home/claude \
            -e CLAUDETG_INTERNAL_TOKEN=ci-internal-token \
            -e WORKER_PROJECT_ID=main \
            claudetg-worker:ci
          for i in $(seq 1 20); do
            if docker exec claudetg-worker-ci node -e "fetch('http://127.0.0.1:3100/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"; then
              break
            fi
            if [ "$i" = 20 ]; then
              docker logs claudetg-worker-ci
              exit 1
            fi
            sleep 1
          done
          test "$(docker exec claudetg-worker-ci sh -lc 'printf %s "$HOME"')" = "/home/claude"
          docker exec claudetg-worker-ci sh -lc 'mkdir -p ~/.claude/skills/ci && echo ok > ~/.claude/skills/ci/persist'
          test "$(docker exec claudetg-worker-ci cat /home/claude/.claude/skills/ci/persist)" = "ok"
